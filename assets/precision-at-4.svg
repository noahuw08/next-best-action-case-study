<svg xmlns="http://www.w3.org/2000/svg" width="700" height="255" viewBox="0 0 700 255" role="img" aria-labelledby="title desc"><title id="title">Matched offline benchmark: Precision at four</title><desc id="desc">Random 0.059. LLM 0.126. LightGBM 0.186, a 47.6 percent relative gain over the LLM.</desc><rect width="700" height="255" rx="12" fill="#FAF9F5"/><g font-family="Arial, sans-serif" font-size="17" fill="#142B38"><text x="24" y="40" font-size="21" font-weight="700">Precision@4 · matched offline benchmark</text><text x="24" y="101">Random</text><rect x="160" y="80" width="126.8" height="30" rx="4" fill="#BFCBC5"/><text x="296.8" y="101" font-weight="700">0.059</text><text x="24" y="153">v2 LLM</text><rect x="160" y="132" width="270.9" height="30" rx="4" fill="#788C96"/><text x="440.9" y="153" font-weight="700">0.126</text><text x="24" y="205">v3 LightGBM</text><rect x="160" y="184" width="399.9" height="30" rx="4" fill="#087F7A"/><text x="569.9" y="205" font-weight="700">0.186</text></g></svg>